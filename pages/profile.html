<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectIn - Profile</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="./feed.html" class="nav-logo">ConnectIn</a>
      <div class="nav-links">
        <a href="./feed.html" class="nav-link">Feed</a>
        <a href="./profile.html" class="nav-link">Profile</a>
        <a href="./connections.html" class="nav-link">People</a>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="main-container">
    <div class="card">
      <h2>My Profile</h2>
      <div id="profileInfo">
        <p><strong>User ID:</strong> <span id="profileUserId"></span></p>
        <p><strong>Email:</strong> <span id="profileEmail"></span></p>
      </div>
    </div>

    <div class="card">
      <h2>My Posts</h2>
      <div id="myPosts">
        <p class="empty-state">Loading...</p>
      </div>
    </div>

    <div class="card">
      <h2>My Connections</h2>
      <div id="myConnections">
        <p class="empty-state">Loading...</p>
      </div>
    </div>
  </div>

  <script type="module" src="../js/profile.js"></script>
</body>

</html>
