<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConnectIn - Feed</title>
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <nav class="navbar">
    <div class="nav-container">
      <a href="./feed.html" class="nav-logo">ConnectIn</a>
      <div class="nav-links">
        <a href="./feed.html" class="nav-link">Feed</a>
        <a href="./profile.html" class="nav-link">Profile</a>
        <a href="./connections.html" class="nav-link">People</a>
        <button class="logout-btn" id="logoutBtn">Logout</button>
      </div>
    </div>
  </nav>

  <div class="main-container">
    <!-- Create Post -->
    <div class="card">
      <h2>Create Post</h2>
      <div class="post-form">
        <textarea id="postContent" placeholder="What's on your mind?"></textarea>
        <input type="file" id="postImage" accept="image/*">
        <button class="btn-primary" id="createPostBtn">Post</button>
        <p class="message" id="postMessage"></p>
      </div>
    </div>

    <!-- Feed -->
    <div class="card">
      <h2>My Feed</h2>
      <div id="feedPosts">
        <p class="empty-state">Loading...</p>
      </div>
    </div>
  </div>

  <script type="module" src="../js/feed.js"></script>
</body>

</html>
